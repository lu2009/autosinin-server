services:
  autosinin-server:
    build: .
    container_name: autosinin-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: "Asia/Shanghai"
      AUTOSININ_PORT: "8080"
      AUTOSININ_HOST: "0.0.0.0"
      AUTOSININ_DB_PATH: "/app/data/autosinin.db"
      AUTOSININ_SESSION_DIR: "/app/data/sessions"
      # 自建 Android 签名服务 (Unidbg libfekit.so)
      AUTOSININ_PROTOCOL_MODE: "${AUTOSININ_PROTOCOL_MODE:-android}"
      AUTOSININ_SIGN_URL: "${AUTOSININ_SIGN_URL:-http://host.docker.internal:8081}"
      AUTOSININ_SIGN_TOKEN: "${AUTOSININ_SIGN_TOKEN:-}"
      AUTOSININ_SCHEDULE_START: "09:00"
      AUTOSININ_SCHEDULE_END: "11:00"
      AUTOSININ_SCHEDULE_ENABLED: "true"
    volumes:
      - ./data:/app/data
